# MySports — scheduled refresh (deployment contract v1.0 §5; spec §15.1)
# DAILY 11:00 UTC = 07:00 EDT / 06:00 EST, plus manual dispatch. Inert until the repository secrets exist.
# Daily since 2026-09-03: render_all already runs every day in season, so a Mon/Wed/Fri refresh meant four
# days a week were rendered from stale rows. One refresh a day, and the render that follows it, stay in step.
name: schedule_refresh
on:
  schedule:
    # TWO RUNS A DAY, BOTH AT :37 (prompt 97, Joe's ruling 2026-09-14; register §46). The header's
    # "DAILY 11:00 UTC" line predates this.
    # 1. THE MINUTE IS DELIBERATE. Scheduled runs are best-effort and :00 is the platform's busiest
    #    minute. The old 11:00 UTC schedule was MEASURED (gh run list, 12 runs 2026-09-02..13) starting a
    #    median 3h44m late, worst 5h13m, and on 2026-09-14 it had not fired 5h22m after it was due.
    #    Moving off :00 usually helps; it is not a guaranteed cure.
    # 2. THE SECOND RUN IS A BACKSTOP, NOT A SECOND OPINION. The loader is idempotent, so a second pass
    #    costs runner minutes and nothing else, and a late or dropped early run no longer means a
    #    wrong card all day.
    # 3. DAYLIGHT SAVING: these times are UTC and have no DST awareness. 07:37 / 11:37 UTC land at 3:37 /
    #    7:37 a.m. EDT until 2026-11-01, then at 2:37 / 6:37 a.m. EST until March. To keep the clock
    #    times, shift BOTH lines by an hour - nothing in the repo will remind you.
    - cron: "37 7 * * *"
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Anchor viewing day (YYYY-MM-DD, ET). Default: today."
        required: false
concurrency: { group: mysports-refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    # was 20 until 2026-09-11 (prompt 92, register §41): run #18 was killed at that ceiling - measured, not guessed
    timeout-minutes: 35
    outputs:
      date: ${{ steps.when.outputs.date }}
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_ASSETS: mysports-assets
      R2_BUCKET_DATA: mysports-data
      MYSPORTS_MARKET: cleveland
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Resolve anchor date (ET) and CFBD week
        id: when
        env: { INPUT_DATE: "${{ github.event.inputs.date }}" }
        run: |
          D="$INPUT_DATE"; if [ -z "$D" ]; then D=$(TZ=America/New_York date +%F); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "cfb_week=$(D=$D python -c "import os,datetime as d;t=d.date.fromisoformat(os.environ['D']);print(max(1,(t-d.date(2026,9,1)).days//7+1))")" >> "$GITHUB_OUTPUT"
      - name: Pull asset cache from R2
        run: python scripts/sync_assets.py --pull
      - name: CFB (CFBD)
        run: |
          python -m adapters.cfbd --week ${{ steps.when.outputs.cfb_week }} --teams
          # finals pass: Sunday (7) and Monday (1) re-fetch the week just played
          DOW=$(date -d ${{ steps.when.outputs.date }} +%u)
          if [ "$DOW" = "7" ] || [ "$DOW" = "1" ]; then
            W=$(python -m pipeline.render_feed --sport cfb --latest-week || true)
            if [ -n "$W" ]; then python -m adapters.cfbd --week "$W"; fi
          fi
      - name: NFL (ESPN) — yesterday, today and the next 6 viewing days (every game day, not only Sunday)
        # PROMPT 88, Joe's ruling 2026-09-10: the same rolling window NBA and MLB use. This fetched two
        # dates - yesterday and the coming Sunday - and `--date` holds ONLY that day's games
        # (adapters/espn.py:177), so Thursday and Monday games were never refreshed on the day they
        # were played. Dates, not NFL week numbers: nothing here has to know what a week is, so flex
        # moves, December Saturdays and the week-18 boundary need no special case.
        # `--no-logos` on every date, as the NBA/NHL/MLB steps do; the art moves to the step below.
        run: |
          for i in -1 0 1 2 3 4 5 6; do
            python -m adapters.espn --league nfl --date $(python -c "import datetime as d;print((d.date.fromisoformat('${{ steps.when.outputs.date }}')+d.timedelta($i)).isoformat())") --no-logos || exit 1
          done
      - name: NFL teams and team art (ESPN) — the refresh the date loop no longer carries
        # NFL is the only league whose team art this adapter writes (adapters/espn.py:290-292), and the
        # date loop above suppresses it. `--teams-only` reaches fetch_logos for all 32 teams and returns
        # before any schedule fetch - the shape bootstrap_season.yml already uses. fetch_logos is
        # idempotent, so an unchanged logo costs a cached check. Named without the word that the R2
        # push step below is selected by in tests/test_workflows.py.
        run: python -m adapters.espn --league nfl --teams-only
      - name: NHL — yesterday (finals pass) then the 7-day window
        run: |
          python -m adapters.nhl --date $(python -c "import datetime as d;print((d.date.fromisoformat('${{ steps.when.outputs.date }}')+d.timedelta(-1)).isoformat())") --no-logos || exit 1
          python -m adapters.nhl --date ${{ steps.when.outputs.date }}
      - name: NBA — yesterday, today and the next 6 viewing days (ESPN source until the league file is reachable from a runner)
        run: |
          for i in -1 0 1 2 3 4 5 6; do
            python -m adapters.nba --date $(python -c "import datetime as d;print((d.date.fromisoformat('${{ steps.when.outputs.date }}')+d.timedelta($i)).isoformat())") --no-logos || exit 1
          done
      - name: MLB — yesterday, today and the next 6 viewing days (statsapi officialDate == ET viewing day)
        run: |
          for i in -1 0 1 2 3 4 5 6; do
            python -m adapters.mlb --date $(python -c "import datetime as d;print((d.date.fromisoformat('${{ steps.when.outputs.date }}')+d.timedelta($i)).isoformat())") --no-logos || exit 1
          done
      - name: Standings — all four pro leagues (one team_records row per club per ET day)
        # Fail honest per league: a league whose fetch fails is skipped inside the module and the
        # others still commit, so one flaky league API never fails the refresh.
        run: python -m pipeline.standings --workflow schedule_refresh
      - name: CFB polls into mysports.rankings (AP / Coaches / CFP)
        # Beside standings because it is the same kind of step: a provider table the cards read, loaded
        # whole rather than reconciled. DAILY even though a poll moves weekly - AP lands Sunday and the
        # Playoff Committee Tuesday, and a fixed weekly slot would either miss one or sit a week stale.
        # Re-running a week is an upsert on (sport, season, week, poll_type, team_id), so the extra runs
        # cost one request per published week and change nothing. Weeks with no poll yet return empty
        # and are skipped, which is every week before the season's first Sunday.
        run: python -m pipeline.rankings --workflow schedule_refresh
      # ---------------------------------------------------------------- programs (prompt 47)
      - name: NASCAR race sessions -> programs (fail-honest)
        # FAIL HONEST PER UNIT, the shape the standings step uses: a fetch that fails logs one line
        # and the refresh carries on. A race schedule that could not be reached is not a reason to
        # lose the day's games.
        #
        # Idempotent by construction - 0012/0013 gave every program_type a partial unique index, so
        # a daily re-run updates 98 rows and inserts none. Rows go through the enum validation and
        # row-level quarantine prompt 46 added to pipeline/db.py, so one bad value costs its own row
        # and not the batch.
        #
        # ONLY NASCAR. IndyCar, WWE, AEW, the studio shows and UFC were not built this run - their
        # research documents are not in the repo (see the prompt-47 report), and a step calling an
        # adapter that does not exist would fail every night for a reason nobody could act on.
        run: |
          set +e
          out="artifacts/programs/nascar_$(date -u +%F).json"
          python -m adapters.nascar --year 2026 --out "$out"
          if [ $? -ne 0 ]; then
            echo "nascar: fetch failed - skipped, refresh continues"
          else
            python -m pipeline.load_programs --input "$out" || echo "nascar: load failed - skipped, refresh continues"
          fi
          exit 0

      # ---------------------------------------------------------------- programs (prompt 48)
      #
      # FIVE MORE STEPS, ALL IN THE SHAPE ABOVE. Prompt 47 could build only the NASCAR one because
      # the research documents the rest load from were not in the repo; they are now, so the other
      # five adapters exist and get a step each. EVERY EXISTING STEP IS BYTE-IDENTICAL - these are
      # added after NASCAR's and nothing is reordered.
      #
      # The shape, once, so the repetition below reads as repetition: `set +e`, run the adapter to a
      # dated file, and if it failed log ONE line and carry on; if it worked, load it and log one
      # line if THAT failed. `exit 0` at the end means a source being down never costs the day's
      # games. Rows go through the enum validation and row-level quarantine in pipeline/db.py, so a
      # bad value costs its own row rather than the batch, and every load is a natural-key upsert -
      # 0012, 0013 and 0015's partial indexes - so a daily re-run updates rather than duplicates.
      #
      # NO ACTIONS EXPRESSION APPEARS IN ANY `run:` BLOCK BELOW. Working rule 28 exists because an
      # EMPTY one - an opening brace pair with nothing between it - inside a shell COMMENT made
      # bootstrap_season.yml unparseable for four days while PyYAML called it valid.
      # tests/test_workflows.py is the guard, not PyYAML.
      #
      # AND THE GUARD PROVED ITSELF ON THIS VERY COMMENT: a first draft spelled the empty expression
      # out as an example, and the guard failed the file for containing exactly the thing the
      # sentence was warning about. It does not distinguish a comment from a command, which is the
      # whole point - neither does Actions.
      - name: IndyCar race sessions -> programs (fail-honest)
        # Built against 2026 rather than 2027 - Joe's amendment, register section 17. The season ends
        # Sept 6, so from Sept 7 this step re-reads a finished season every night and updates 18 rows
        # to the same values. That is cheap and it is CORRECT: the day indycar.com publishes 2027,
        # --year has to move, and a step that had stopped running would not be there to move.
        run: |
          set +e
          out="artifacts/programs/indycar_$(date -u +%F).json"
          python -m adapters.indycar --year 2026 --out "$out"
          if [ $? -ne 0 ]; then
            echo "indycar: fetch failed - skipped, refresh continues"
          else
            python -m pipeline.load_programs --input "$out" || echo "indycar: load failed - skipped, refresh continues"
          fi
          exit 0

      - name: WWE Raw / SmackDown / PLEs -> programs (fail-honest)
        # TWO surfaces, and the adapter needs both: the Premier Shows block for the slots and the
        # platforms, wwe.com/events for the names and venues. Either one failing fails the step,
        # which is the honest outcome - a PLE with no name is not something to load.
        run: |
          set +e
          out="artifacts/programs/wwe_$(date -u +%F).json"
          python -m adapters.wwe --through 2026-12-31 --out "$out"
          if [ $? -ne 0 ]; then
            echo "wwe: fetch failed - skipped, refresh continues"
          else
            python -m pipeline.load_programs --input "$out" || echo "wwe: load failed - skipped, refresh continues"
          fi
          exit 0

      - name: AEW Dynamite / Collision -> programs (fail-honest)
        # THE MONTHLY PARSE RUNS INSIDE THIS DAILY STEP. docs/research/aew.md is emphatic that the
        # WBD monthly HBO Max schedule is the only authority for Collision's night and network, and
        # on 2026-09-05 it could not be reached - press.wbd.com carries no AEW content at its root
        # and no trade had republished one. So the adapter runs the slot-default path and RE-READS
        # allelitewrestling.com every night to report a DRIFT line the day the site stops agreeing
        # with data/aew_2026_schedule.json. That drift line is the signal to go looking for the
        # monthly schedule again; the Wednesday research watch is the other path.
        run: |
          set +e
          out="artifacts/programs/aew_$(date -u +%F).json"
          python -m adapters.aew --through 2026-12-31 --out "$out"
          if [ $? -ne 0 ]; then
            echo "aew: fetch failed - skipped, refresh continues"
          else
            python -m pipeline.load_programs --input "$out" || echo "aew: load failed - skipped, refresh continues"
          fi
          exit 0

      - name: UFC fight cards -> programs (fail-honest)
        # The Paramount+ page is updated about weekly and announces cards 8-12 weeks out, so a daily
        # re-read is how a newly announced card arrives. No CBS row is written unless the page flags
        # a simulcast; no segment times are invented.
        run: |
          set +e
          out="artifacts/programs/ufc_$(date -u +%F).json"
          python -m adapters.ufc --year 2026 --out "$out"
          if [ $? -ne 0 ]; then
            echo "ufc: fetch failed - skipped, refresh continues"
          else
            python -m pipeline.load_programs --input "$out" || echo "ufc: load failed - skipped, refresh continues"
          fi
          exit 0

      - name: Studio shows -> registry, programs and instances (fail-honest)
        # THREE WRITES, and the order matters: the programs first, then the registry and the
        # instances, because an instance links to the program by its natural key and the link is
        # null until the program exists.
        #
        # THE GAMEDAY SITE PARSE RUNS HERE. It reads whatever ESPN Press Room releases are recorded
        # under tests/fixtures/; a week with no recorded release keeps site_tier = tba and renders no
        # subtitle. BIG NOON STAYS tba UNTIL A PARSEABLE SOURCE EXISTS - foxsports.com Press Pass
        # answers 200 on three paths with zero tables and zero occurrences of "Big Noon", because it
        # is JS-rendered. The Wednesday research watch is the override path: a human reads the page
        # and edits data/studio_crews.json or drops a release into tests/fixtures/, and this step
        # picks it up the next night. Nothing here guesses a site.
        run: |
          set +e
          out="artifacts/programs/studio_$(date -u +%F).json"
          python -m pipeline.load_studio_shows --through 2026-12-31 --export "$out"
          if [ $? -ne 0 ]; then
            echo "studio: generation failed - skipped, refresh continues"
          else
            python -m pipeline.load_programs --input "$out" || echo "studio: program load failed - skipped, refresh continues"
            python -m pipeline.load_studio_shows --through 2026-12-31 || echo "studio: registry/instances failed - skipped, refresh continues"
          fi
          exit 0

      - name: Reconcile program eligibility (migration 0014)
        # PROGRAM-SCOPED ON PURPOSE. `--programs` on its own reconciles programs and nothing else, so
        # this cannot touch the game side and cannot collide with the game reconcile further down.
        # Working rule 27 is about two BULK writes running at once; these run in sequence in one job.
        #
        # It is the last program step because it reads what the five above wrote: a program loaded
        # tonight has no eligibility row until this runs, and the app shows an ELIGIBILITY MISSING
        # cue for one that has none rather than calling it watchable.
        run: python -m pipeline.reconcile --programs --workflow schedule_refresh

      - name: Push new logos to R2
        # --make-dark CONDITIONS BEFORE PUSHING (prompt 61 stage 2). The step above fetches a base
        # logo for every team, but a listings card floats the logo on charcoal and reads
        # {id}_dark.png; without this the runner would push 766 base files and whatever dark art the
        # provider happened to serve, which for most teams is a byte copy of the base that sinks
        # into --panel #23262B. sync_assets.py:152 documents the flag as idempotent, and
        # build_web_marks.team_dark_variants leaves genuinely distinct provider art alone.
        # THE OPT-IN FLAG AT THE END OF THE LINE BELOW IS DELIBERATE, NOT NOISE (prompt 95): --push now
        # refuses to CREATE objects unless told to, because a bare push from a laptop nearly published
        # retired art twice. This step creates objects legitimately - a new team's logo and its dark
        # variant (run #21 made four) - so it opts in. Remove the flag and the first nightly with a new
        # logo fails here.
        run: python scripts/sync_assets.py --push --prefix logos/ --make-dark --allow-new
      - name: Load fixtures into mysports.* (evidence only — Milestone 1 loader)
        run: python -m pipeline.load --all --workflow schedule_refresh
      - name: CFB ranks, records + rivalry flags into games (loader-written provider facts)
        # Records move on every game day, the poll moves once a week (AP drops Sunday, the
        # Playoff Committee Tuesday), so this runs DAILY with --fetch: that keeps records current
        # and picks the new poll up on the day it lands, which a Tuesday-only step would not do
        # for records. Ranks are per-poll inside the module - a week with no poll published yet
        # leaves them untouched rather than erasing last week's, so a daily run is safe.
        run: python -m pipeline.enrich_cfb --current-week --fetch --workflow schedule_refresh
      - name: Reconcile canonical facts (Milestone 2 — games with new evidence)
        run: python -m pipeline.reconcile --workflow schedule_refresh
      - name: Unit tests (resolver)
        run: python -m unittest tests.test_reconcile
      - name: Watch links — REPORT ONLY, never fails the run
        # Joe's ruling, 2026-09-09: this must not fail the workflow. `WATCH` is 34 hand-maintained
        # URLs at 34 external hosts, and those hosts WILL have transient failures that have nothing to
        # do with this repo. A nightly job that goes red for somebody else's outage gets ignored —
        # which is exactly how `guardians-tv` sat on a hard 404 until Joe tapped it.
        #
        # BELT AND BRACES: the script exits 0 whatever it finds, AND this carries continue-on-error,
        # so neither a bad link nor a missing node on the runner can take the refresh down.
        #
        # THE REPORT IS SEEN ON THE RUN'S SUMMARY PAGE, not in a log: the script appends a markdown
        # table to $GITHUB_STEP_SUMMARY, headed with the number of dead links. `ubuntu-latest` ships
        # Node, so this needs no setup-node step.
        continue-on-error: true
        run: node web/scripts/probes/watch-links.mjs
      - name: Archive fixtures + raw payloads (private bucket)
        run: python scripts/sync_assets.py --push-data artifacts/validation --prefix fixtures/$(date -u +%Y-%m-%d)/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ steps.when.outputs.date }}
          path: artifacts/validation
          retention-days: 14
  render:
    needs: refresh
    uses: ./.github/workflows/render_all.yml
    secrets: inherit
    with:
      date: ${{ needs.refresh.outputs.date }}
