# MySports — scheduled refresh (deployment contract v1.0 §5; spec §15.1)
# DAILY 11:00 UTC = 07:00 EDT / 06:00 EST, plus manual dispatch. Inert until the repository secrets exist.
# Daily since 2026-09-03: render_all already runs every day in season, so a Mon/Wed/Fri refresh meant four
# days a week were rendered from stale rows. One refresh a day, and the render that follows it, stay in step.
name: schedule_refresh
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Anchor viewing day (YYYY-MM-DD, ET). Default: today."
        required: false
concurrency: { group: mysports-refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      date: ${{ steps.when.outputs.date }}
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_ASSETS: mysports-assets
      R2_BUCKET_DATA: mysports-data
      MYSPORTS_MARKET: cleveland
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Resolve anchor date (ET) and CFBD week
        id: when
        env: { INPUT_DATE: "${{ github.event.inputs.date }}" }
        run: |
          D="$INPUT_DATE"; if [ -z "$D" ]; then D=$(TZ=America/New_York date +%F); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "cfb_week=$(D=$D python -c "import os,datetime as d;t=d.date.fromisoformat(os.environ['D']);print(max(1,(t-d.date(2026,9,1)).days//7+1))")" >> "$GITHUB_OUTPUT"
      - name: Pull asset cache from R2
        run: python scripts/sync_assets.py --pull
      - name: CFB (CFBD)
        run: |
          python -m adapters.cfbd --week ${{ steps.when.outputs.cfb_week }} --teams
          # finals pass: Sunday (7) and Monday (1) re-fetch the week just played
          DOW=$(date -d ${{ steps.when.outputs.date }} +%u)
          if [ "$DOW" = "7" ] || [ "$DOW" = "1" ]; then
            W=$(python -m pipeline.render_feed --sport cfb --latest-week || true)
            if [ -n "$W" ]; then python -m adapters.cfbd --week "$W"; fi
          fi
      - name: NFL (ESPN) — yesterday (finals pass) then the coming Sunday's week
        run: |
          python -m adapters.espn --league nfl --date $(python -c "import datetime as d;print((d.date.fromisoformat('${{ steps.when.outputs.date }}')+d.timedelta(-1)).isoformat())") || exit 1
          python -m adapters.espn --league nfl --date $(python -c "import datetime as d;t=d.date.fromisoformat('${{ steps.when.outputs.date }}');print((t+d.timedelta((6-t.weekday())%7)).isoformat())")
      - name: NHL — yesterday (finals pass) then the 7-day window
        run: |
          python -m adapters.nhl --date $(python -c "import datetime as d;print((d.date.fromisoformat('${{ steps.when.outputs.date }}')+d.timedelta(-1)).isoformat())") --no-logos || exit 1
          python -m adapters.nhl --date ${{ steps.when.outputs.date }}
      - name: NBA — next 7 viewing days (ESPN source until the league file is reachable from a runner)
        run: |
          for i in -1 0 1 2 3 4 5 6; do
            python -m adapters.nba --date $(python -c "import datetime as d;print((d.date.fromisoformat('${{ steps.when.outputs.date }}')+d.timedelta($i)).isoformat())") --no-logos || exit 1
          done
      - name: MLB — next 7 viewing days (statsapi officialDate == ET viewing day)
        run: |
          for i in -1 0 1 2 3 4 5 6; do
            python -m adapters.mlb --date $(python -c "import datetime as d;print((d.date.fromisoformat('${{ steps.when.outputs.date }}')+d.timedelta($i)).isoformat())") --no-logos || exit 1
          done
      - name: Standings — all four pro leagues (one team_records row per club per ET day)
        # Fail honest per league: a league whose fetch fails is skipped inside the module and the
        # others still commit, so one flaky league API never fails the refresh.
        run: python -m pipeline.standings --workflow schedule_refresh
      - name: CFB polls into mysports.rankings (AP / Coaches / CFP)
        # Beside standings because it is the same kind of step: a provider table the cards read, loaded
        # whole rather than reconciled. DAILY even though a poll moves weekly - AP lands Sunday and the
        # Playoff Committee Tuesday, and a fixed weekly slot would either miss one or sit a week stale.
        # Re-running a week is an upsert on (sport, season, week, poll_type, team_id), so the extra runs
        # cost one request per published week and change nothing. Weeks with no poll yet return empty
        # and are skipped, which is every week before the season's first Sunday.
        run: python -m pipeline.rankings --workflow schedule_refresh
      # ---------------------------------------------------------------- programs (prompt 47)
      - name: NASCAR race sessions -> programs (fail-honest)
        # FAIL HONEST PER UNIT, the shape the standings step uses: a fetch that fails logs one line
        # and the refresh carries on. A race schedule that could not be reached is not a reason to
        # lose the day's games.
        #
        # Idempotent by construction - 0012/0013 gave every program_type a partial unique index, so
        # a daily re-run updates 98 rows and inserts none. Rows go through the enum validation and
        # row-level quarantine prompt 46 added to pipeline/db.py, so one bad value costs its own row
        # and not the batch.
        #
        # ONLY NASCAR. IndyCar, WWE, AEW, the studio shows and UFC were not built this run - their
        # research documents are not in the repo (see the prompt-47 report), and a step calling an
        # adapter that does not exist would fail every night for a reason nobody could act on.
        run: |
          set +e
          out="artifacts/programs/nascar_$(date -u +%F).json"
          python -m adapters.nascar --year 2026 --out "$out"
          if [ $? -ne 0 ]; then
            echo "nascar: fetch failed - skipped, refresh continues"
          else
            python -m pipeline.load_programs --input "$out" || echo "nascar: load failed - skipped, refresh continues"
          fi
          exit 0

      - name: Push new logos to R2
        run: python scripts/sync_assets.py --push --prefix logos/
      - name: Load fixtures into mysports.* (evidence only — Milestone 1 loader)
        run: python -m pipeline.load --all --workflow schedule_refresh
      - name: CFB ranks, records + rivalry flags into games (loader-written provider facts)
        # Records move on every game day, the poll moves once a week (AP drops Sunday, the
        # Playoff Committee Tuesday), so this runs DAILY with --fetch: that keeps records current
        # and picks the new poll up on the day it lands, which a Tuesday-only step would not do
        # for records. Ranks are per-poll inside the module - a week with no poll published yet
        # leaves them untouched rather than erasing last week's, so a daily run is safe.
        run: python -m pipeline.enrich_cfb --latest-week --fetch --workflow schedule_refresh
      - name: Reconcile canonical facts (Milestone 2 — games with new evidence)
        run: python -m pipeline.reconcile --workflow schedule_refresh
      - name: Unit tests (resolver)
        run: python -m unittest tests.test_reconcile
      - name: Archive fixtures + raw payloads (private bucket)
        run: python scripts/sync_assets.py --push-data artifacts/validation --prefix fixtures/$(date -u +%Y-%m-%d)/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ steps.when.outputs.date }}
          path: artifacts/validation
          retention-days: 14
  render:
    needs: refresh
    uses: ./.github/workflows/render_all.yml
    secrets: inherit
    with:
      date: ${{ needs.refresh.outputs.date }}
