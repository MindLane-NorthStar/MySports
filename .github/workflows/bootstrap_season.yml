# MySports — season bootstrap (spec §17). Manual only.
name: bootstrap_season
on:
  workflow_dispatch:
    inputs:
      season: { description: "Season start year", required: true, default: "2026" }
      sports: { description: "Comma list: cfb,nfl,nhl,nba,mlb", required: true, default: "cfb,nfl,nhl,nba,mlb" }
      cfb_weeks: { description: "CFB regular-season week range, e.g. 1-15", required: false, default: "1-15" }
      nfl_weeks: { description: "NFL regular-season week range, e.g. 1-18", required: false, default: "1-18" }
      # NHL and NBA are DATE-DRIVEN: their providers answer "what is on this day", not "what is in
      # week N". Left empty they do nothing, so this workflow behaves exactly as it did before.
      nhl_from:  { description: "NHL first date, YYYY-MM-DD (empty = skip)",  required: false, default: "" }
      nhl_to:    { description: "NHL last date, YYYY-MM-DD",                 required: false, default: "" }
      nba_from:  { description: "NBA first date, YYYY-MM-DD (empty = skip)", required: false, default: "" }
      nba_to:    { description: "NBA last date, YYYY-MM-DD",                 required: false, default: "" }
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # Raised from 30: reconcile --all now walks a whole season (~1,200 games) rather than the 375 that
    # existed when this workflow only loaded teams. If it still times out, split by sport - reconciling
    # LESS is not the answer, because a half-reconciled season is worse than a slow one.
    timeout-minutes: 90
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_ASSETS: mysports-assets
      R2_BUCKET_DATA: mysports-data
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Teams + logos for every requested sport
        run: |
          IFS=, read -ra SP <<< "${{ github.event.inputs.sports }}"
          for S in "${SP[@]}"; do
            case $S in
              cfb) python -m adapters.cfbd --week 1 --teams ;;
              nfl) python -m adapters.espn --league nfl --teams-only ;;
              nhl) python -m adapters.nhl --date $(TZ=America/New_York date +%F) --all-logos ;;
              nba) python -m adapters.nba --date $(TZ=America/New_York date +%F) --all-logos ;;
              mlb) python -m adapters.mlb --date $(TZ=America/New_York date +%F) --teams --all-logos ;;
            esac
          done
      # The opt-in flag is deliberate (prompt 96): this workflow exists to fetch art the bucket does not have yet.
      - run: python scripts/sync_assets.py --push --allow-new
      - name: Reference data -> mysports.* (idempotent)
        run: python -m pipeline.bootstrap
      # THE STEP THIS WORKFLOW WAS MISSING. It fetched teams and logos and then loaded whatever
      # fixtures happened to be on disk, which is exactly why only CFB weeks 1 and 8 and NFL week 1
      # ever existed. Both adapters already take --week; nothing but this loop was needed.
      #
      # A WEEK THAT RETURNS NO GAMES IS LOGGED AND SKIPPED, NEVER FATAL. The range is a guess - a
      # season's real week count moves with bowl scheduling and flex - so the loop has to survive
      # overshooting it. `|| true` on the fetch, and the run continues.
      - name: Fetch every requested week's games (regular season only)
        run: |
          IFS=, read -ra SP <<< "${{ github.event.inputs.sports }}"
          season="${{ github.event.inputs.season }}"
          # The date-driven sports' ranges, read into plain shell vars so the nhl|nba branch below
          # can choose between them. Prompt 46 intended these and never wrote them: its loop
          # referenced $NHL_FROM and friends while nothing assigned them, so even a parsing workflow
          # would have reported "no date range given" and loaded nothing.
          NHL_FROM="${{ github.event.inputs.nhl_from }}"; NHL_TO="${{ github.event.inputs.nhl_to }}"
          NBA_FROM="${{ github.event.inputs.nba_from }}"; NBA_TO="${{ github.event.inputs.nba_to }}"
          expand() {  # "1-15" or "1,3,5" -> a space-separated list
            local spec="$1"
            if [[ "$spec" == *-* ]]; then seq "${spec%%-*}" "${spec##*-}"; else echo "$spec" | tr ',' ' '; fi
          }
          for S in "${SP[@]}"; do
            case $S in
              cfb)
                for W in $(expand "${{ github.event.inputs.cfb_weeks }}"); do
                  echo "::group::cfb week $W"
                  python -m adapters.cfbd --year "$season" --week "$W" --season-type regular                     || echo "cfb week $W: no games or fetch failed - skipped"
                  echo "::endgroup::"
                done ;;
              nfl)
                for W in $(expand "${{ github.event.inputs.nfl_weeks }}"); do
                  echo "::group::nfl week $W"
                  python -m adapters.espn --league nfl --season "$season" --week "$W"                     || echo "nfl week $W: no games or fetch failed - skipped"
                  echo "::endgroup::"
                done ;;
              nhl|nba)
                # An Actions expression is substituted BEFORE this shell runs, so the range cannot
                # be selected with a shell variable inside one - both are read into plain shell vars
                # above and chosen here.
                #
                # AND THE BRACES ARE NOT WRITTEN OUT ANYWHERE IN THIS BLOCK, not even in a comment:
                # Actions substitutes expressions inside shell comments too, and an empty one is a
                # parse error ("An expression was expected"). Prompt 46's version of this very
                # comment contained a literal empty expression and stopped the whole workflow file
                # from parsing - every push since failed in 0s.
                if [[ "$S" == nhl ]]; then from="$NHL_FROM"; to="$NHL_TO"; else from="$NBA_FROM"; to="$NBA_TO"; fi
                if [[ -z "$from" || -z "$to" ]]; then
                  echo "$S: no date range given - teams/logos only"
                else
                  d="$from"
                  while [[ "$d" < "$to" || "$d" == "$to" ]]; do
                    echo "::group::$S $d"
                    # A ZERO-GAME DATE IS NORMAL, not fatal: these seasons have dark days and the
                    # provider answers 200 with an empty list. The `|| echo` keeps the loop going so
                    # one bad date cannot cost the other 179. api-web.nhle.com also resets
                    # intermittently; a date it still cannot reach is logged and skipped rather than
                    # taking the whole run down.
                    python -m adapters.$S --date "$d" || echo "$S $d: no games or fetch failed - skipped"
                    echo "::endgroup::"
                    d=$(date -u -d "$d + 1 day" +%F)
                  done
                fi ;;
              *) echo "$S: no week loop (date-driven sport); teams/logos only" ;;
            esac
          done

      - name: Load every fixture on disk (evidence only)
        run: python -m pipeline.load --all --workflow bootstrap_season
      - name: Reconcile canonical facts (Milestone 2 — every game)
        run: python -m pipeline.reconcile --all --workflow bootstrap_season
