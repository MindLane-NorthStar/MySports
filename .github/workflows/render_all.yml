# MySports — render the viewing day(s) and publish grids to R2 (deployment contract v1.0 §5; contract §11)
# Runs AFTER A REFRESH (schedule_refresh.yml's `render` job calls it: `needs: refresh` + `uses:`) or on
# manual dispatch. Inert until secrets exist.
# IT HAS NO SCHEDULE OF ITS OWN, ON PURPOSE (prompt 98, Joe's ruling 2026-09-14; register §47). It had one -
# 09:30 UTC in season - and its header claimed that ran "after a successful refresh". It never did:
# measured, the standalone run fired BEFORE the refresh on 12 of 12 days (2026-09-02..13), by 42-74
# minutes, so every grid it drew on its own schedule came from the previous day's rows. A failed refresh
# should leave yesterday's grids in R2 untouched, not publish a fresh-looking stale one. Do not add a
# schedule back as an apparent omission.
name: render_all
on:
  workflow_dispatch:
    inputs:
      date: { description: "Viewing day (YYYY-MM-DD, ET). Default: today.", required: false }
  workflow_call:
    inputs:
      date: { type: string, required: false }
concurrency: { group: mysports-render, cancel-in-progress: true }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_ASSETS: mysports-assets
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt cairosvg   # cairosvg installs cleanly on ubuntu-latest (the Windows problem does not apply here)
      - name: Fonts for rasterization
        run: mkdir -p ~/.fonts && python scripts/sync_assets.py --pull --prefix fonts/ && cp assets/fonts/*.ttf ~/.fonts/ && fc-cache -f
      - name: Pull logos + network marks
        run: python scripts/sync_assets.py --pull
      - name: Resolve date
        id: when
        run: |
          D="${{ inputs.date || github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=America/New_York date +%F); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - name: Render every in-season sport that has games in the database for the day
        run: |
          set -e
          D=${{ steps.when.outputs.date }}
          for S in nhl nba nfl mlb; do
            F="artifacts/validation/db_${S}_${D}_fixture.json"
            # --teams-out writes the renderer's teams file FROM THE DATABASE. This job runs on its own
            # fresh runner and artifacts/ is gitignored, so the adapter output the refresh job produced is
            # not here - which is how this step failed with FileNotFoundError on mlb_2026_teams.json.
            N=$(python -m pipeline.render_feed --sport $S --date $D --out "$F" --teams-out | grep '^db feed:' | awk '{print $3}')
            echo "$S: ${N:-0} game(s) in the database for $D"
            if [ "${N:-0}" -gt 0 ]; then
              python scripts/render_day.py --sport $S --date $D --png --export --fixture "$F"
            fi
          done
          # CFB: Saturday renders the newest loaded week (the feed carries the whole week; render_day picks the day)
          if [ "$(date -d $D +%u)" = "6" ]; then
            W=$(python -m pipeline.render_feed --sport cfb --latest-week || true)
            if [ -n "$W" ]; then
              F="artifacts/validation/db_cfbd_week${W}_fixture.json"
              N=$(python -m pipeline.render_feed --sport cfb --week "$W" --out "$F" --teams-out | grep '^db feed:' | awk '{print $3}')
              echo "cfb: week $W, ${N:-0} game(s) in the database"
              if [ "${N:-0}" -gt 0 ]; then
                python scripts/render_day.py --week "$W" --date $D --png --export --fixture "$F"
              fi
            fi
          fi
      - name: Publish grids to R2 (last-known-good stays if a render is missing — uploads are per file)
        run: python scripts/sync_assets.py --push-grids artifacts/rendering
      - name: Register the archived grids (mysports.generated_grids — spec §7.12, §12)
        run: python scripts/register_grids.py artifacts/rendering --workflow actions
