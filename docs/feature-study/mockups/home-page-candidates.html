<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MySports TV — Home Page Candidates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* ---- locked tokens + locked card rules, copied verbatim from mobile_demo.html (2026-09-02) ---- */
:root{
  --ground:#1B1B1B; --panel-hi:#31363D; --panel-lo:#1E2126; --line:#3A3F47; --line-soft:#2B2F35;
  --ink:#F2F2F0; --dim:#9AA0A8; --faint:#6A7078; --gold:#F0C850; --gold-dim:#8A7530;
  --disp:"Barlow Condensed","Arial Narrow","Liberation Sans Narrow","Roboto Condensed","DejaVu Sans Condensed",sans-serif; --body:"Barlow","Segoe UI","DejaVu Sans Condensed",Arial,Helvetica,sans-serif;
}
.abar{display:flex; align-items:center; gap:10px; padding:12px 14px 8px}
.abar .wm{font-family:var(--disp); font-weight:700; font-size:22px; letter-spacing:.05em; text-transform:uppercase;
  color:#fff; text-shadow:0 0 2px #F0C850, 0 0 8px rgba(240,200,80,.5)}
.abar .wm b{color:var(--gold)}
.abar .day{margin-left:auto; font-family:var(--disp); font-weight:600; font-size:15px; color:var(--dim); letter-spacing:.06em}
.chiprow{display:flex; gap:6px; padding:4px 14px 10px; overflow-x:auto}
.secthead{display:flex; align-items:center; gap:8px; padding:10px 14px 6px}
.secthead img{height:20px; width:20px; object-fit:contain}
.secthead .t{font-family:var(--disp); font-weight:700; font-size:17px; letter-spacing:.1em; text-transform:uppercase}
.secthead .c{color:var(--faint); font-size:12px}
.secthead .gbtn{margin-left:auto; padding:4px 10px 3px; border:1px solid var(--gold-dim); border-radius:3px;
  font-family:var(--disp); font-weight:600; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold)}
.mcard{position:relative; display:grid; grid-template-columns:44px minmax(0,1fr) auto minmax(58px,auto); gap:8px; align-items:center;
  padding:10px 10px 12px; border:1px solid var(--line-soft); border-radius:4px; text-align:left;
  background:linear-gradient(180deg, rgba(49,54,61,.6), rgba(30,33,38,.6)); overflow:hidden; width:100%}
.mcard .t{font-family:var(--disp); font-weight:600; font-size:15px; color:var(--gold); line-height:1.1; align-self:start; padding-top:2px}
.mcard .t small{display:block; font-size:10px; color:var(--faint); letter-spacing:.1em}
.mcard .mid{min-width:0; display:flex; flex-direction:column; gap:4px}
.duel{display:grid; grid-template-columns:1fr auto 1fr; gap:2px 4px; align-items:center}
.duel.fixcol .atbig{justify-self:end; margin-right:2px}
.duel.hug{display:flex; align-items:flex-start; gap:6px}
.duel.hug .tcol{flex:0 1 auto; min-width:0}
.duel.hug .atbig{flex:0 0 auto}
.tcol{display:flex; flex-direction:column; gap:2px; min-width:0}
.tcol .tl1{display:flex; align-items:center; gap:6px; font-weight:600; font-size:15px; line-height:1.15}
.tcol .tl1 img{height:26px; width:26px; object-fit:contain; flex:0 0 auto}
.tcol .tl1 span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tcol .tl1 span.nm2{font-size:12.5px}
.tcol .tl1 span.nm3{font-size:11px; letter-spacing:-.01em}
.tcol .tl2{font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tcol .tl3{font-size:11px; color:#C9B98A; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tcol .tl3.tba{color:var(--faint)}
.atbig{font-family:var(--disp); font-weight:600; font-size:22px; color:var(--faint); padding:0 2px;
  align-self:start; line-height:26px}
.lnet{font-size:11px; color:var(--faint)}
.mcard .midlogo{justify-self:center; display:flex; align-items:center; align-self:start; filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.mcard .midlogo img{height:100%; width:auto; object-fit:contain}
.mcard .midlogo.nlfull{height:54px; margin-top:7px}
/* full 3-line height, centered on line 2 */
.mcard .midlogo.nlfull img{max-width:96px}
.mcard .midlogo.nl23{height:36px; margin-top:16px}
/* 2/3 of 3-line height, centered on line 2 */
.mcard .midlogo.nl23 img{max-width:72px}
.mcard .midlogo.none{visibility:hidden; width:0}
.rcol{justify-self:end; text-align:right; align-self:start; padding-top:2px}
.rcol .oline{display:flex; align-items:center; justify-content:flex-end; gap:4px; font-family:var(--disp); font-weight:600; font-size:13px; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.rcol .oline img{height:18px; width:18px; object-fit:contain}
.rcol .oline.ou{color:var(--dim); font-size:12px}
.rcol .st{font-family:var(--disp); font-weight:600; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.rcol .st.fin{color:#141414; background:var(--gold); padding:2px 7px 1px; border-radius:2px}
.mcard .seam{position:absolute; left:0; right:0; bottom:0; height:3px}
/* ---- study chrome (not part of the design language) ---- */
/* MOCKUP DEVIATION (logged A-14): the sandbox lacks Barlow, so at 390 px the locked 15px/26px line 1 truncates CFB names.
   The mockup renders line 1 at 13px with 22px logos and hides the network-mark slot on phones (the text pill stands in for the mark; the grey network line still names it) so the candidates can be read; production keeps the locked sizes with Barlow. */
@media (max-width:1199px){ .mcard .midlogo{display:none} .mcard{grid-template-columns:44px minmax(0,1fr) minmax(64px,auto)} .rcol{white-space:nowrap} .tcol .tl1{font-size:13px} .tcol .tl1 img{height:22px;width:22px} .mcard{gap:6px} .rcol .live .cl{font-size:9px} }
body{background:#1B1B1B radial-gradient(140% 60% at 50% -8%, #3B3B3B 0%, #232323 42%, #1B1B1B 64%, #0E0E0E 100%) fixed}
.studybar{position:sticky;top:0;z-index:50;font-family:var(--body);background:#0E0E0E;border-bottom:1px solid var(--line-soft);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.studybar .cand{display:flex;gap:4px}
.studybar .cand button{padding:4px 7px;font-size:11px;border:1px solid var(--line);border-radius:3px;font-family:var(--disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--dim)}
.studybar .cand button.on{color:#141414;background:var(--gold);border-color:var(--gold)}
.studybar select,.studybar input[type=range]{accent-color:var(--gold)}
.studybar .clock{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--gold);min-width:110px}
.wrap{max-width:1200px;margin:0 auto;padding:0 0 60px}
.hdr{padding:16px 14px 4px}
.hdr .wm{font-family:var(--disp);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 0 18px rgba(240,200,80,.25)}
.hdr .wm b{color:var(--gold)}
.hdr .sub{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.nav{display:flex;gap:18px;padding:8px 14px;border-bottom:1px solid var(--line-soft);font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--dim)}
.nav .on{color:var(--ink);border-bottom:2px solid var(--gold)}
.chiprow .chip{padding:5px 10px 4px;border:1px solid var(--line);border-radius:3px;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.chiprow .chip.on{color:var(--gold);border-color:var(--gold)}
.dstrip{display:flex;gap:6px;padding:0 14px 8px}
.dstrip button{padding:4px 8px;border:1px solid var(--line);border-radius:3px;font-family:var(--disp);font-size:12px;letter-spacing:.06em;color:var(--dim)}
.dstrip button.on{color:var(--gold);border-color:var(--gold)}
.band{padding:0 10px}
.mrows{display:flex;flex-direction:column;gap:6px;padding:0 4px 6px}
.access{font-size:10px;margin-right:4px}
.access.ok{color:var(--gold)} .access.no{color:var(--faint)}
.mcard.dimmed{opacity:.5}
.rcol .live{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.rcol .live .sc{font-size:16px;line-height:1;color:var(--ink)} .rcol .live .cl{font-size:10px;letter-spacing:.04em;color:#E0555A;text-transform:uppercase}
.rcol .live .cl.done{color:var(--faint)}
.rcol .st.mkt{color:#C9B98A}
.netpill{display:inline-block;max-width:46px;font-size:10px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 5px;border:1px solid var(--line);border-radius:3px;font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--panel-lo)}
.count{font-size:11px;color:var(--faint);padding:0 14px 8px}
.count b{color:var(--dim);font-weight:500}
.watch{padding:4px 8px 3px;border:1px solid var(--gold-dim);border-radius:3px;font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-left:auto}
.empty{padding:14px;color:var(--dim);font-size:13px}
.jump{display:inline-block;margin:4px 14px 10px;padding:4px 10px 3px;border:1px solid var(--line);border-radius:3px;font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.asof{padding:8px 14px 14px;font-size:11px;color:var(--faint)}
.pin{border:1px solid var(--gold-dim);border-radius:4px;margin:0 10px 8px;padding:6px 0 0}
.pin .secthead .t{color:var(--gold)}
/* schematic grid (candidate B) */
.gridwrap{overflow-x:auto;padding:0 10px 10px}
.grid{position:relative;display:grid;grid-template-columns:150px 1fr;font-family:var(--body)}
.grid .rail{display:flex;flex-direction:column}
.grid .rail div{height:88px;display:flex;align-items:center;padding:0 8px}
.grid .rail .tile{width:134px;height:74px;border-radius:8px;background:linear-gradient(180deg,#31363D,#1E2126);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.06em;color:#E8EAEC;text-align:center;line-height:1.1;padding:4px}
.grid .lanes{position:relative;overflow:hidden}
.grid .lane{position:relative;height:88px;border-top:1px solid rgba(255,255,255,.24)}
.grid .blk{position:absolute;top:6px;height:74px;border-radius:9px;background:#23282E;box-shadow:0 2px 6px rgba(0,0,0,.5);border:2.5px solid rgba(255,255,255,.55);overflow:hidden;display:grid;grid-template-columns:52px 1fr 52px}
.grid .blk.mq{border-color:var(--gold);border-width:3.5px}
.grid .blk .cap{display:flex;align-items:center;justify-content:center} .grid .blk .cap img{width:38px;height:38px;object-fit:contain}
.grid .blk .bands{display:grid;grid-template-rows:1fr 1fr}
.grid .blk .bands span{display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.grid .blk .bands span small{font-size:9px;opacity:.82;margin-left:4px}
.grid .axis{grid-column:2;position:relative;height:22px;font:700 11px Inter,Arial,sans-serif;color:#E8EAEC}
.grid .axis span{position:absolute;top:2px}
.grid .col{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.10)}
.grid .now{position:absolute;top:0;bottom:0;width:2px;background:rgba(240,200,80,.55);z-index:3}
.gridnote{padding:6px 14px 10px;font-size:11px;color:var(--faint)}
@media(min-width:1200px){ .desk.wide{display:block} .desk{display:grid;grid-template-columns:420px 1fr;gap:18px;align-items:start} .desk .first{grid-column:1} .desk .rest{grid-column:2} }
</style></head><body>

const LOCAL=new Set(["cle","cfb-194"]);
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state={cand:"E",day:"2026-09-05",clock:1185,showAll:false};
const CANDS=[["A","A · Today listings"],["B","B · Grid-first"],["C","C · On now"],["D","D · Tonight"],["E","E · Hybrid"],["F","F · Local-first"]];
function mins(et){const [h,m]=et.slice(11).split(':').map(Number);return h*60+m;}
function fmt(m){let h=Math.floor(m/60)%24,mm=m%60;const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')} ${ap}`;}
function fmtShort(m){let h=Math.floor(m/60)%24,mm=m%60;h=h%12||12;return `${h}:${String(mm).padStart(2,'0')}`;}
function team(g,side){const id=side==="home"?g.home_id:g.away_id;const t=FX.teams[id]||{};return {id,name:side==="home"?g.home:g.away,c1:t.c1||"#4A4F57",logo:t.logo||null};}
function seam(g){const a=team(g,"away"),h=team(g,"home");return `background:linear-gradient(90deg, ${a.c1} 0%, ${a.c1} 40%, ${h.c1} 60%, ${h.c1} 100%)`;}
function dayGames(){return FX.games.filter(g=>g.viewing_day===state.day).sort((a,b)=>a.et.localeCompare(b.et));}
function elig(g){return g.available===true;}
function liveState(g){const s=mins(g.et),e=s+(g.duration||180),n=state.clock;
  if(g.result_status==="final")return {st:"post"};
  if(n<s-10)return {st:"pre"};
  if(n>=e)return {st:"post",simulated:true};
  if(n<s)return {st:"pre",soon:true};
  const frac=(n-s)/(e-s);
  if(g.sport==="mlb"){const inn=Math.min(9,1+Math.floor(frac*9));return {st:"in",detail:(frac*9%1<.5?"TOP":"BOT")+" "+inn};}
  const q=Math.min(4,1+Math.floor(frac*4));const cl=Math.max(0,15-Math.floor((frac*4%1)*15));return {st:"in",detail:`Q${q} ${cl}:00`};}
function rankName(t,g,side){const r=side==="home"?g.home_rank:g.away_rank;return (r?`${r} `:"")+t.name;}
function tcol(g,t,side){const nm=rankName(t,g,side);const cls=nm.length>19?' class="nm3"':nm.length>13?' class="nm2"':'';
  const rec=(side==="home"?g.home_record:g.away_record);const p=g.prob&&g.prob[side==="home"?"h":"a"];
  return `<span class="tcol"><span class="tl1">${t.logo?`<img src="${t.logo}" alt="">`:""}<span${cls}>${esc(nm)}</span></span>${rec?`<span class="tl2">${esc(rec)}</span>`:""}${g.sport==="mlb"?(p?`<span class="tl3">${esc(p)}</span>`:`<span class="tl3 tba">Starter TBA</span>`):""}</span>`;}
function rcol(g,ls){
  if(ls.st==="post"&&g.away_score!=null)return `<span class="live"><span class="sc">${g.away_score}–${g.home_score}</span><span class="cl done">Final</span></span>`;
  if(ls.st==="post")return `<span class="st fin">Final</span>`;
  if(ls.st==="in")return `<span class="live"><span class="sc">${g.simA??''}${simScore(g)}</span><span class="cl">${esc(ls.detail)}</span></span>`;
  if(g.market_certainty==="market-pending")return `<span class="st mkt">Market TBA</span>`;
  if(g.odds){const ft=FX.teams[g.odds.fav_id];return `<span class="oline">${ft&&ft.logo?`<img src="${ft.logo}" alt="">`:""}<span>${esc(g.odds.fav.split(" ").slice(-1)[0])}</span></span><span class="oline ou">O/U ${esc(g.odds.ou)}</span>`;}
  return `<span class="st">Sched</span>`;}
function simScore(g){const h=[...g.id].reduce((a,c)=>a+c.charCodeAt(0),0);const s=mins(g.et),n=state.clock,frac=Math.max(0,Math.min(1,(n-s)/(g.duration||180)));const a=Math.floor((h%4+1)*frac*(g.sport==="mlb"?1.2:7)),b=Math.floor(((h>>2)%4+1)*frac*(g.sport==="mlb"?1.2:7));return `${a}–${b}`;}
function card(g,opts={}){const a=team(g,"away"),h=team(g,"home");const ls=liveState(g);const ok=elig(g);
  return `<button class="mcard${!ok?' dimmed':''}">
    <span class="t">${esc(fmtShort(mins(g.et)))}<small>${mins(g.et)>=720?"PM":"AM"}</small></span>
    <span class="mid"><span class="duel hug">${tcol(g,a,"away")}<span class="atbig">@</span>${tcol(g,h,"home")}</span>
      <span class="lnet">${opts.access?`<span class="access ${ok?'ok':'no'}">${ok?'✓':'⊘'}</span>`:""}${esc(g.row||g.network||"—")}${!ok&&g.omit_reason?` · ${esc(g.omit_reason)}`:""}</span></span>
    <span class="midlogo nl23"><span class="netpill">${esc((g.network||"").replace(" Network","").replace("Sports Network","SN").replace("Guardians TV","GUARD").replace("USA Network","USA"))}</span></span>
    <span class="rcol">${rcol(g,ls)}</span>
    <span class="seam" style="${seam(g)}"></span></button>`;}
function secthead(t,c,btn){return `<div class="secthead"><span class="t">${t}</span><span class="c">${c}</span>${btn||""}</div>`;}
function rows(list,opts){return `<div class="mrows">${list.map(g=>card(g,opts)).join("")}</div>`;}
function countLine(list){const on=list.filter(elig),off=list.filter(g=>!elig(g));const outlets=[...new Set(off.map(g=>g.network).filter(Boolean))].slice(0,4).join(", ");
  return `<div class="count"><b>${on.length} on your services</b> · ${off.length} not on your services${outlets?` · ${esc(outlets)}${off.length>4?"…":""}`:""} <button class="jump" style="margin:0 0 0 8px;padding:1px 6px" id="toggleAll">${state.showAll?"hide":"show"}</button></div>`;}
function chips(){const sports=["all","cfb","nfl","mlb","nba","nhl"];return `<div class="chiprow">${sports.map(s=>`<button class="chip${s==="all"?" on":""}">${s==="all"?"All":s.toUpperCase()}</button>`).join("")}</div>`;}
function header(){return `<div class="hdr"><div class="wm">MySports <b>TV</b></div><div class="sub">Every Game. Every Channel. One Place.</div></div>
  <div class="nav"><span class="on">Today</span><span>Weeks</span><span>History</span></div>${chips()}
  <div class="dstrip">${["2026-09-03","2026-09-05","2026-09-13"].map(d=>`<button class="${d===state.day?"on":""}">${new Date(d+"T12:00").toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"})}</button>`).join("")}</div>`;}
function asof(){return `<div class="asof">Data as of ${fmt(state.clock-7)} ET · next refresh ${fmt(state.clock+8)} · viewing day ${state.day} (3:00 AM cutover)</div>`;}
function bySport(list,opts){const sports=[...new Set(list.map(g=>g.sport))];return sports.map(s=>{const gs=list.filter(g=>g.sport===s);return `<div class="band">${secthead(s.toUpperCase(),`${gs.length} games`)}${rows(gs,opts)}</div>`;}).join("");}
function visible(list){return state.showAll?list:list.filter(elig);}
function onNow(list){return list.filter(g=>elig(g)&&(liveState(g).st==="in"||liveState(g).soon));}
function nextUp(list){return list.filter(g=>elig(g)&&liveState(g).st==="pre"&&!liveState(g).soon).slice(0,2);}
function finals(list){return list.filter(g=>elig(g)&&liveState(g).st==="post");}
function tonight(list){const w0=(state.day==="2026-09-13")?13*60:(state.day==="2026-09-05"?12*60:18*60);return list.filter(g=>mins(g.et)>=w0&&mins(g.et)<24*60);}
function bandOnNow(list){const on=onNow(list),nx=nextUp(list);
  let h=`<div class="band">${secthead("On now",`${on.length} airing · ${fmt(state.clock)} ET`,`<button class="watch">Watch ↗</button>`)}`;
  h+=on.length?rows(on.slice(0,4),{access:true})+(on.length>4?`<span class="jump">+${on.length-4} more on now</span>`:""):`<div class="empty">Nothing airing on your services right now.</div>`;
  if(nx.length)h+=secthead("Next up","")+rows(nx,{access:true});
  return h+"</div>";}
function bandTonight(list){const t=tonight(list);const on=t.filter(elig);const off=t.filter(g=>!elig(g));
  const lbl=state.day==="2026-09-13"?"Sunday":state.day==="2026-09-05"?"Today's slate":"Tonight";
  let h=`<div class="band">${secthead(lbl,`${on.length} on your services · from ${fmt(mins((t[0]||{et:state.day+"T18:00"}).et))}`)}`;
  h+=on.length?rows(on,{access:true}):`<div class="empty">Nothing on your services tonight. Next watchable game: Fri 9:00 PM · Miami @ Stanford · ESPN.</div>`;
  h+=`<div class="count">${off.length} not on your services · ${esc([...new Set(off.map(g=>g.network))].slice(0,4).join(", "))}</div></div>`;return h;}
function bandFinals(list){const f=finals(list);const tmr=`<div class="empty">Tomorrow: ${state.day==="2026-09-05"?"Notre Dame vs Wisconsin · 7:30 PM · NBC; Ole Miss vs Louisville · 7:30 PM · ABC":"see Weeks"}</div>`;
  return `<div class="band">${secthead("Finals",`${f.length} completed`)}${f.length?rows(f,{access:true}):`<div class="empty">No finals yet.</div>`}${secthead("Tomorrow","")}${tmr}</div>`;}
function schematicGrid(list){const on=list.filter(elig);if(!on.length)return `<div class="empty">No eligible games to draw.</div>`;
  const rowsOrder=["ABC","CBS","FOX","NBC","The CW","ESPN","ESPN2","ESPNU","FS1","TNT","USA Network","CBS Sports Network","Big Ten Network","ACC Network","SEC Network","Peacock","ESPN+","SEC Network+","Guardians TV","WOIO 19 / CBS","WJW 8 / FOX","WKYC 3 / NBC"];
  const key=g=>g.row||g.network;const nets=[...new Set(on.map(key))].sort((a,b)=>(rowsOrder.indexOf(a)+99)%99-(rowsOrder.indexOf(b)+99)%99);
  const t0=Math.floor(Math.min(...on.map(g=>mins(g.et)))/60)*60,t1=Math.ceil((Math.max(...on.map(g=>mins(g.et)+(g.duration||180)))+30)/30)*30;const px=1.6;const W=(t1-t0)*px;
  let axis=`<div class="axis" style="width:${W}px">`;for(let m=t0;m<=t1;m+=60)axis+=`<span style="left:${(m-t0)*px}px">${fmt(m)}</span>`;axis+="</div>";
  let rail=`<div class="rail">${nets.map(n=>`<div><div class="tile">${esc(n)}</div></div>`).join("")}</div>`;
  let lanes=`<div class="lanes" style="width:${W}px">`;for(let m=t0;m<=t1;m+=30)lanes+=`<div class="col" style="left:${(m-t0)*px}px"></div>`;
  if(state.clock>=t0&&state.clock<=t1)lanes+=`<div class="now" style="left:${(state.clock-t0)*px}px"></div>`;
  for(const n of nets){lanes+=`<div class="lane">`;const gs=on.filter(g=>key(g)===n).sort((a,b)=>a.et.localeCompare(b.et));
    gs.forEach((g,i)=>{const s=mins(g.et);let e=s+(g.duration||180);if(gs[i+1])e=Math.min(e,mins(gs[i+1].et));const a=team(g,"away"),h=team(g,"home");const mq=(g.home_rank&&g.away_rank);
      lanes+=`<div class="blk${mq?' mq':''}" style="left:${(s-t0)*px}px;width:${(e-s)*px-4}px"><span class="cap" style="background:${a.c1}66"><img src="${a.logo||''}" alt=""></span><span class="bands"><span style="background:${a.c1}">${esc(rankName(a,g,"away"))}<small>${esc(g.away_record||"")}</small></span><span style="background:${h.c1}">@ ${esc(rankName(h,g,"home"))}<small>${esc(g.home_record||"")}</small></span></span><span class="cap" style="background:${h.c1}66"><img src="${h.logo||''}" alt=""></span></div>`;});
    lanes+="</div>";}
  lanes+="</div>";
  return `<div class="gridwrap"><div class="grid"><div></div>${axis}${rail}${lanes}</div></div><div class="gridnote">Schematic day grid drawn from the contract's geometry (150 rail, 74-px blocks, bands + caps, marquee gold rim, truncate-at-next-kickoff) with a gold now-marker (proposed v1.7 entry). Not the archival renderer; network marks are text tiles because R2 was unreachable in the study sandbox.</div>`;}
function fitNames(){document.querySelectorAll('.tl1 span').forEach(sp=>{sp.classList.remove('nm2','nm3');if(sp.scrollWidth>sp.clientWidth+1){sp.classList.add('nm2');if(sp.scrollWidth>sp.clientWidth+1){sp.classList.remove('nm2');sp.classList.add('nm3');}}});}
function render(){const list=dayGames();const vis=visible(list);let first="",rest="";
  const c=state.cand;
  if(c==="A"){rest=bySport(list.filter(elig),{});}
  if(c==="B"){first=`<div class="band">${secthead("Day grid",`${list.filter(elig).length} on the grid`)}</div>`+schematicGrid(list);rest=bySport(vis,{access:true});}
  if(c==="C"){first=bandOnNow(list);rest=`<span class="jump">See all today ↓</span>`+bySport(vis,{access:true});}
  if(c==="D"){first=bandTonight(list);rest=`<span class="jump">See all today ↓</span>`+bySport(vis,{access:true});}
  if(c==="E"){const on=onNow(list);const lastEnd=Math.max(...list.filter(elig).map(g=>mins(g.et)+(g.duration||180)));
    if(on.length||(state.clock>=Math.min(...list.filter(elig).map(g=>mins(g.et)))&&state.clock<lastEnd))first=bandOnNow(list);else if(state.clock>=lastEnd)first=bandFinals(list);else first=bandTonight(list);
    rest=`<span class="jump">See all today ↓</span>`+countLine(list)+bySport(vis,{access:true});}
  if(c==="F"){const loc=list.filter(g=>[g.home_id,g.away_id].some(id=>/cle$|cfb-194$/.test(id)));first=`<div class="pin">${secthead("Cleveland",`${loc.length} today · assumed teams`)}${loc.length?rows(loc,{access:true}):`<div class="empty">No Cleveland team today.</div>`}</div>`;rest=bySport(vis,{access:true});}
  $("#app").innerHTML=header()+`<div class="desk${c==="B"||c==="A"?" wide":""}"><div class="first">${first}</div><div class="rest">${rest}</div></div>`+asof();
  $("#clocklbl").textContent=fmt(state.clock)+" ET";
  fitNames();
  const tg=$("#toggleAll");if(tg)tg.onclick=()=>{state.showAll=!state.showAll;render();};}
$("#cands").innerHTML=CANDS.map(([k,l])=>`<button data-c="${k}" class="${k===state.cand?'on':''}">${l}</button>`).join("");
$("#cands").onclick=e=>{const b=e.target.closest("button");if(!b)return;state.cand=b.dataset.c;[...$("#cands").children].forEach(x=>x.classList.toggle("on",x===b));render();};
$("#day").onchange=e=>{state.day=e.target.value;render();};
$("#clock").oninput=e=>{state.clock=+e.target.value;render();};
render();
</script></body></html>
